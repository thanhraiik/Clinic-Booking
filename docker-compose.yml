services: 
  postgres:
    image: postgres:17
    container_name: clinic-booking-postgres
    environment:
      POSTGRES_DB: clinic_booking
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: clinic_password
    ports:
      - 5432:5432
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U clinic_user -d clinic_booking"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes: 
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: clinic-booking-redis
    ports: 
      - 6379:6379
    healthcheck: 
      test: ["CMD-SHELL", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
        